    };
    this.$('#stand-price').onclick = () => { if (Engine.isUnlocked(this.state, 'price') || Engine.isUnlocked(this.state, 'recipes')) this.openPanel('recipes'); };
    this.$('#mission-hint-btn').onclick = () => {
      const h = this.$('#mission-hint');
      h.classList.toggle('hidden');
      this.$('#mission-hint-btn').setAttribute('aria-expanded', String(!h.classList.contains('hidden')));
    };
    this.$('#dock').dataset.sig = '';
    this.renderDock();
    this.updateHud(true);
  },

  // Tap = one sell. Holding (mouse/touch/pen) repeats. Keyboard uses click (detail === 0).
  bindSellButton(btn) {
    const stop = () => this.stopHold();
    btn.addEventListener('pointerdown', (e) => {
      if (e.button !== undefined && e.button !== 0) return;
      stop();
      this.onSell(e);
      this._holdT = setTimeout(() => { this._holdI = setInterval(() => this.onSell(), 150); }, 400);
    });
    for (const ev of ['pointerup', 'pointerleave', 'pointercancel']) btn.addEventListener(ev, stop);
    btn.addEventListener('click', (e) => { if (e.detail === 0) this.onSell(e); });
    btn.addEventListener('contextmenu', (e) => e.preventDefault());
  },

  stopHold() { clearTimeout(this._holdT); clearInterval(this._holdI); this._holdT = this._holdI = null; },

  // Dock tiles appear as features unlock. Tile ids are #tab-<key>.
  dockTiles() {
    const s = this.state;
    const u = (k) => Engine.isUnlocked(s, k);
    return [
      { key: 'shop', icon: '🛒', label: 'Shop', show: u('shop'), cls: '' },
      { key: 'menu-recipes', icon: '📖', label: 'Menu', show: u('price') || u('recipes'), cls: 'pink' },
      { key: 'upgrades', icon: '🔧', label: 'Upgrade', show: u('upgrades') || u('staff'), cls: 'green' },
      { key: 'goals', icon: '🎯', label: 'Goals', show: true, cls: 'pink' },
      { key: 'stats', icon: '📊', label: 'Stats', show: u('stats'), cls: '' },
    ];
  },
  renderDock() {
    const dock = this.$('#dock');
    if (!dock) return;
    const tiles = this.dockTiles().filter((t) => t.show);
    const sig = tiles.map((t) => t.key).join(',');
    if (dock.dataset.sig === sig) return;
    const prev = dock.dataset.sig ? dock.dataset.sig.split(',') : null;   // null = first render, nothing is "new"
    dock.dataset.sig = sig;
    dock.innerHTML = tiles.map((t) => `
      <button class="tile ${t.cls} ${prev && !prev.includes(t.key) ? 'new' : ''}" id="tab-${t.key}" data-key="${t.key}" aria-label="${t.label}">
        <span aria-hidden="true">${t.icon}</span><small>${t.label}</small>
      </button>`).join('');
    for (const b of this.$$('.tile', dock)) b.onclick = () => { b.classList.remove('new'); this.openPanel(b.dataset.key === 'menu-recipes' ? 'recipes' : b.dataset.key); };
  },

  updateHud(full) {
    const s = this.state;
    if (!s || !this.$('#hud-money')) return;
    const set = (id, v) => { const e = this.$('#' + id); if (e && e.textContent !== String(v)) e.textContent = v; };
    const R = D.RECIPES[s.activeRecipe];

    set('hud-level', s.level + 1);
    set('hud-money', this.money(s.money, Math.abs(s.money) >= 100 ? 0 : 2));
    this.$('#hud-money-pill').classList.toggle('neg', s.money < 0);
    set('hud-rep', s.rep.toFixed(2));
    set('hud-day', s.day);
    set('hud-golden', s.prestige.goldenLemons);
    this.$('#hud-golden-pill').classList.toggle('hidden', !s.prestige.goldenLemons);
    set('btn-sound', this.prefs.sound ? '🔊' : '🔇');
    this.$('#btn-sound').setAttribute('aria-label', this.prefs.sound ? 'Mute sound' : 'Turn sound on');

    // mission
    const m = Engine.currentMission(s);
    if (m) {
      const p = Engine.missionProgress(s);
      set('mission-tag', `Level ${s.level + 1}`);
      set('mission-goal', `${m.name}: ${m.goal}`);
      const fmt = (v) => (/profit|revenue/i.test(m.metric) ? this.money(v, 0) : m.metric === 'rep' ? Number(v).toFixed(2) : m.metric === 'bestMargin' ? v + '%' : this.num(v));
      set('mission-num', `${fmt(Math.max(0, p.value))} / ${fmt(p.target)}`);
      this.$('#mission-bar').style.width = (p.pct * 100).toFixed(1) + '%';
      set('mission-hint', `${m.hint || ''} Reward: ${this.money(m.reward || 0, 0)}.`);
      this.$('#mission-hint-btn').classList.remove('hidden');
    } else {
      set('mission-tag', 'Empire');
      set('mission-goal', 'Every goal complete. Keep franchising for golden lemons.');
      set('mission-num', `🌟 ${s.prestige.goldenLemons}`);
      this.$('#mission-bar').style.width = '100%';
      this.$('#mission-hint-btn').classList.add('hidden');
      this.$('#mission-hint').classList.add('hidden');
    }

    // stand
    set('stand-drink', R.icon);
    set('stand-recipe', R.name + (s.trending === s.activeRecipe && s.recipes.length > 1 ? ' 📈' : ''));
    set('stand-price', this.money(Engine.sellPrice(s)));
    const dayPct = s.tick / D.CONFIG.DAY_TICKS;
    this.$('#day-bar').style.width = (dayPct * 100).toFixed(1) + '%';
    this.$('#stage-sun').style.left = `calc(${(8 + dayPct * 80).toFixed(1)}% - 16px)`;
    set('stage-sun', D.WEATHER[s.weather.today].icon);
    this.$('#sky').classList.toggle('dusk', dayPct > 0.8);
    this.$('#sky').classList.toggle('wet', !!D.WEATHER[s.weather.today].wet);
    set('day-label', `Day ${s.day}`);
    set('day-left', `${D.CONFIG.DAY_TICKS - s.tick}s`);
    const ev = s.event ? D.EVENTS[s.event.id] : null;
    const flag = this.$('#event-flag');
    flag.classList.toggle('hidden', !ev);
    if (ev) set('event-flag', `${ev.icon} ${ev.name}`);
    this.renderQueue();
    const staff = Engine.staffServeRate(s);
    const make = Engine.maxMakeable(s, s.activeRecipe);
    const meta = [`${Engine.tapPower(s)} per tap`];
    if (staff > 0) meta.push(`staff ${staff.toFixed(1)}/sec`);
    meta.push(make > 0 ? `${this.num(make)} cups in stock` : 'Out of stock!');
    set('sell-meta', meta.join(' • '));
    this.$('#rescue').classList.toggle('hidden', !Engine.rescueAvailable(s));
    const priceable = Engine.isUnlocked(s, 'price') || Engine.isUnlocked(s, 'recipes');
    this.$('#stand-price').classList.toggle('clickable', priceable);
    this.$('#stand-price').title = priceable ? 'Change price or drink' : '';
    this.$('#sell-meta').classList.toggle('neg', make < 5);
    this.$('#btn-sell').classList.toggle('ready', s.queue.length > 0 && make > 0);
    this.$('#btn-sell').setAttribute('aria-label', `Sell. ${s.queue.length} waiting, ${make} cups in stock`);

    // weather
    const w = D.WEATHER[s.weather.today];
    set('w-icon', w.icon);
    set('w-name', w.name);
    const dem = Engine.demandBreakdown(s);
    set('weather-mult', `${Math.round(dem.weather * 100)}% customers`);
    set('w-note', (ev ? `${ev.icon} ${ev.name} today` : '') || (s.trending === s.activeRecipe && s.recipes.length > 1 ? '📈 Your drink is trending (+25%)' : ''));
    const fc = this.$('#w-forecast');
    if (Engine.isUnlocked(s, 'weather')) {
      const f = D.WEATHER[s.weather.forecast];
      const html = `Tomorrow: <b>${f.icon} ${f.name}</b> <span class="locked">${Math.round(f.demand * 100)}% customers • ${Math.round(s.weather.accuracy * 100)}% sure</span>`;
      if (fc.innerHTML !== html) fc.innerHTML = html;
    } else set('w-forecast', `🔒 Forecast unlocks after level ${D.unlockLevel('weather')}`);
    const plan = this.$('#w-plan');
    plan.classList.toggle('hidden', !Engine.isUnlocked(s, 'weather'));
    if (Engine.isUnlocked(s, 'weather')) {
      const est = Engine.estimateCustomers(s, s.weather.forecast);
      const have = Engine.maxMakeable(s, s.activeRecipe);
      const short = have < est;
      const html = `📦 Expect ~<b>${this.num(est)}</b> customers • you have stock for <b class="${short ? 'neg' : 'pos'}">${this.num(have)}</b>${short && Engine.isUnlocked(s, 'shop') ? ' <button class="linkish small-link" id="plan-shop">Stock up</button>' : ''}`;
      if (plan.innerHTML !== html) {
        plan.innerHTML = html;
        const b = this.$('#plan-shop');
        if (b) b.onclick = () => this.openPanel('shop');
      }
    }

    // challenges
    const cc = this.$('#card-challenges');
    cc.classList.toggle('hidden', !Engine.isUnlocked(s, 'challenges'));
    if (Engine.isUnlocked(s, 'challenges')) {
      const done = s.challenges.filter((c) => c.done).length;
      set('ch-count', `${done}/${s.challenges.length} done • resets tomorrow`);
      const html = s.challenges.map((c) => {
        const def = D.CHALLENGES.find((x) => x.id === c.id);
        const v = Math.max(0, Engine.metric(s, def.metric));
        const pct = Math.min(1, v / c.target);
        const vv = def.metric === 'todayProfit' ? this.money(v, 0) : this.num(v);
        const tt = def.metric === 'todayProfit' ? this.money(c.target, 0) : this.num(c.target);
        return `<div class="ch ${c.done ? 'done' : ''}"><span>${c.done ? '✅' : def.icon}</span>
          <div><div>${Engine.challengeText(c, (n) => this.money(n, 0))}</div>
          <div class="minibar"><i style="width:${(pct * 100).toFixed(0)}%"></i></div></div>
          <small>${c.done ? 'Done' : `${vv}/${tt}`}<br>+${this.money(c.reward, 0)}</small></div>`;
      }).join('');
      const box = this.$('#challenges');
      if (box.innerHTML !== html) box.innerHTML = html;
    }

    // today
    const t = s.today;
    const profit = t.revenue - t.cost;
    set('t-cups', t.cups);
    set('t-rev', this.money(t.revenue));
    set('t-cost', this.money(t.cost));
    set('t-profit', this.money(profit));
    this.$('#t-profit').className = profit >= 0 ? 'pos' : 'neg';
    set('t-liked', t.liked);
    set('t-lost', t.lost);
    this.$('#t-lost').className = t.lost ? 'neg' : '';
    set('today-margin', t.revenue > 0 ? `${Math.round((profit / t.revenue) * 100)}% margin` : '');
    const y = s.lastDay;
    this.$('#t-yesterday').classList.toggle('hidden', !y);
    if (y) set('t-yesterday', `Yesterday: ${y.cups} cups • ${this.money(y.profit, 0)} profit${y.lost ? ` • ${y.lost} walked away` : ''}${y.quit ? ' • someone quit' : ''}`);

    // stock
    const uses = R.uses;
    const ids = D.INGREDIENT_IDS.filter((id) => Engine.ingredientVisible(s, id));
    const invHtml = ids.map((id) => {
      const low = uses[id] && s.inventory[id] < uses[id] * 10;
      return `<span class="chip ${uses[id] ? 'used' : ''} ${low ? 'low' : ''}" title="${D.INGREDIENTS[id].name}${uses[id] ? ` • ${uses[id]} per cup` : ''}">${D.INGREDIENTS[id].icon} ${this.num(s.inventory[id])}</span>`;
    }).join('') + (Engine.isUnlocked(s, 'shop') ? '<button class="chip chip-btn" id="stock-shop">+ Buy</button>' : '');
    const inv = this.$('#inv');
    if (inv.innerHTML !== invHtml) {
      inv.innerHTML = invHtml;
      const b = this.$('#stock-shop');
      if (b) b.onclick = () => this.openPanel('shop');
    }
    set('stock-cap', `max ${this.num(Engine.storageCap(s))} each`);

    const newsSig = s.news.length + ':' + (s.news[0] && s.news[0].text);
    if (full || this._newsSig !== newsSig) {
      this._newsSig = newsSig;
      this.$('#news').innerHTML = s.news.slice(0, 6).map((n) => `<div><span class="news-day">D${n.day}</span> ${n.icon} ${this.esc(n.text)}</div>`).join('');
    }
    this.renderDock();
    this.updateBadges();
    this.updateCoach();
  },

  // Small red dots on dock tiles: something affordable to upgrade, or stock running low.
  updateBadges() {
    const s = this.state;
    const dot = (id, on) => { const el = this.$('#' + id); if (el) el.classList.toggle('has-dot', !!on); };
    const affordable = D.UPGRADE_IDS.some((id) => Engine.upgradeAvailable(s, id) && s.upgrades[id] < D.UPGRADES[id].max && s.money >= D.upgradeCost(id, s.upgrades[id]) && D.UPGRADES[id].tab !== 'staff');
    dot('tab-upgrades', affordable);
    dot('tab-shop', Engine.maxMakeable(s, s.activeRecipe) < 10 && !(s.upgrades.restock && s.restockOn));
  },

  renderQueue() {
    const s = this.state;
    const q = this.$('#queue');
    const cap = Engine.queueCap(s);
    const P = D.CONFIG.PATIENCE_TICKS;
    const max = D.CONFIG.QUEUE_ICONS_MAX;
    const shown = s.queue.slice(0, max);
    const sig = shown.map((c) => c.c + (s.clock - c.t >= P * 0.65 ? '!' : '')).join(',') + '|' + s.queue.length + '/' + cap;
    if (q.dataset.sig === sig) return;
    q.dataset.sig = sig;
    if (!s.queue.length) { q.innerHTML = '<span class="empty">Waiting for customers…</span>'; return; }
    q.innerHTML = shown.map((c) => {
      const cust = D.CUSTOMERS.find((x) => x.id === c.c) || {};
      const angry = s.clock - c.t >= P * 0.65;
      return `<span class="cust ${angry ? 'angry' : ''}" title="${cust.name || ''}${angry ? ' (about to leave)' : ''}">${angry ? '😤' : cust.icon || '🧑'}</span>`;
    }).join('') + (s.queue.length > max ? `<span class="empty">+${s.queue.length - max}</span>` : '')
      + `<span class="empty">${s.queue.length}/${cap}</span>`;
  },

  floatText(text, bad, x) {
    const box = this.$('#floats');
    if (!box) return;
    if (box.children.length > 10) box.firstChild.remove();
    const f = document.createElement('span');
    f.className = 'float' + (bad ? ' bad' : '');
    f.textContent = text;
    f.style.left = (x !== undefined ? x : 30 + Math.random() * 40) + '%';
    f.style.top = (8 + Math.random() * 20) + '%';
    box.appendChild(f);
    setTimeout(() => f.remove(), 1000);
  },

  // ---------- coach tips (tutorial) ----------
  updateCoach() {
    const s = this.state;
    const coach = this.$('#coach');
    if (!coach) return;
    let tip = this._coachTip && !s.tips[this._coachTip.id] ? this._coachTip : null;
    if (!tip) tip = D.TIPS.find((t) => !s.tips[t.id] && t.when(s)) || null;
    // the first tip only matters while it's still true; skip it silently once you've sold
    if (tip && tip.id === 'sell' && !tip.when(s)) { s.tips.sell = s.day; tip = null; }
    if (tip !== this._coachTip) {
      this.$$('.coach-glow').forEach((e) => e.classList.remove('coach-glow'));
      this._coachTip = tip;
      if (tip) this.$('#coach-text').innerHTML = tip.text;
    }
    coach.classList.toggle('hidden', !tip);
    if (tip) {
      const target = this.$(tip.target);
      if (target && !target.classList.contains('coach-glow')) target.classList.add('coach-glow');
    }
  },
  dismissCoach() {
    if (!this._coachTip) return;
    this.state.tips[this._coachTip.id] = this.state.day;
    this.$$('.coach-glow').forEach((e) => e.classList.remove('coach-glow'));
    this._coachTip = null;
    this.updateCoach();
    this.save();
  },
});


/* ===== app_day.js ===== */
/* =====================================================================
 * app_day.js — the core loop: real-time ticks (with catch-up after the
 * browser throttles a background tab), SELL taps, and turning Engine
 * event objects into floats, toasts, sounds and popups.
 * In ?test=1 mode the timer never starts; tests drive App.debugStep(n).
 * ===================================================================== */
Object.assign(App, {
  startLoop() {
    this.stopLoop();
    this.lastTickAt = Date.now();
    if (this.opts.test) return;
    this.timer = setInterval(() => this.onTick(), Math.round(250 / this.opts.speed));   // poll 4×/tick; ticks are time-based
  },
  stopLoop() {
    if (this.timer) clearInterval(this.timer);
    this.timer = null;
  },
  tickMs() { return 1000 / this.opts.speed; },

  // Advances as many ticks as real time says are due.
  onTick() {
    if (!this.state) return;
    if (this.opts.test) return this.runTicks(1);
    // The world waits while a message is open, so reading never costs customers.
    if (this.$('#popup')) { this.lastTickAt = Date.now(); return; }
    const due = Math.floor((Date.now() - this.lastTickAt) / this.tickMs());
    if (due < 1) return;
    this.lastTickAt += due * this.tickMs();
    this.runTicks(due);
  },

  // n === 1: normal. Small gaps run quietly. Big gaps (tab was hidden) reuse the offline simulation.
  runTicks(n) {
    const s = this.state;
    if (n > 90) {
      const res = Engine.simulateOffline(s, n);
      this.lastTickAt = Date.now();
      if (!res.skipped) {
        this.toast(`⏩ Caught up ${Math.round(n / 60)} min: ${this.num(res.cups)} cups, ${this.money(res.earned, 0)}`, 'good', 4000);
      } else {
        this.toast('⏸️ Your stand paused while the tab was hidden. Staff keep selling when you’re away.', 'day', 4000);
      }
      this.renderHub();
      this.save();
      return;
    }
    const quiet = n > 1;
    for (let i = 0; i < n; i++) {
      const q = quiet && i < n - 1;
      this.handleEvents(Engine.step(this.state), false, q);
      if (!q && this.state.tick === D.CONFIG.DAY_TICKS - 10) this.eveningForecast();
    }
    this.updateHud();
    if (this.panel) this.refreshPanel(true);
    if (Date.now() - this.lastSaveAt > 5000) this.save();
  },

  // Test hook: advance n ticks synchronously through the same pipeline.
  debugStep(n) {
    for (let i = 0; i < n; i++) this.runTicks(1);
    return { day: this.state.day, tick: this.state.tick, money: this.state.money, level: this.state.level };
  },

  onSell(e) {
    const s = this.state;
    if (!s) return;
    if (this.$('#popup')) return;
    if (!s.queue.length) {
      if (!this._emptyShown || Date.now() - this._emptyShown > 900) { this._emptyShown = Date.now(); this.floatText('No one waiting', true); }
      return;
    }
    const events = Engine.tap(s);
    this.handleEvents(events, true);
    this.updateHud();
    const btn = this.$('#btn-sell');
    if (btn && btn.animate && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
      btn.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.06)' }, { transform: 'scale(1)' }], { duration: 120 });
    }
  },

  handleEvents(events, fromTap, quiet) {
    let staffSales = 0, staffAmount = 0, lostFull = 0, lostImpatient = 0, noStock = false, tipped = false;
    for (const ev of events) {
      switch (ev.type) {
        case 'sale':
          if (ev.tip) tipped = true;
          if (ev.manual) { this.floatText(`+${this.money(ev.amount)}${ev.tip ? ' 💕' : ''}`); this.sfx(ev.tip ? 'tip' : 'sale'); }
          else { staffSales++; staffAmount += ev.amount; }
          break;
        case 'lost':
          if (ev.reason === 'impatient') lostImpatient += ev.count || 1; else lostFull++;
          break;
        case 'nostock': noStock = true; break;
        case 'restock': if (!quiet) this.floatText(`📦 -${this.money(ev.cost)}`, true, 70); break;
        case 'dayEnd': this.onDayEnd(ev.summary, quiet); break;
        case 'dayStart': if (!quiet) this.onDayStart(ev); break;
        case 'event': {
          const d = D.EVENTS[ev.id];
          if (!quiet) this.toast(`${d.icon} ${d.name}! ${d.text}`, 'good', 4500);
          break;
        }
        case 'choice': this.showChoice(ev.id); break;
        case 'levelUp': this.showLevelUp(ev); break;
        case 'challenge': {
          const c = D.CHALLENGES.find((x) => x.id === ev.id);
          this.toast(`📋 Challenge done: ${c.icon} +${this.money(ev.reward, 0)}`, 'good', 3000);
          this.sfx('coin');
          break;
        }
        case 'achievement': {
          const a = D.ACHIEVEMENTS.find((x) => x.id === ev.id);
          this.toast(`🏆 Achievement: ${a.icon} ${a.name}`, 'good', 3500);
          this.sfx('level');
          break;
        }
        default: break;
      }
    }
    if (quiet) return;
    if (staffSales) {
      this.floatText(`+${this.money(staffAmount)} 👷`, false, 58);
      if (!fromTap && Date.now() - (this._staffSfxAt || 0) > 700) { this._staffSfxAt = Date.now(); this.sfx(tipped ? 'tip' : 'sale'); }
    }
    if (noStock) this.warnStock(fromTap);
    if (lostImpatient) this.floatText(`😤 ${lostImpatient} left`, true, 12);
    if (lostFull && this.state.queue.length >= Engine.queueCap(this.state)) {
      if (!this._fullWarned || Date.now() - this._fullWarned > 6000) {
        this._fullWarned = Date.now();
        this.floatText('Line is full', true, 10);
      }
    }
  },

  // Ten seconds before closing, remind the player to prepare for a big or small tomorrow.
  eveningForecast() {
    const s = this.state;
    if (!Engine.isUnlocked(s, 'weather')) return;
    const f = D.WEATHER[s.weather.forecast];
    const est = Engine.estimateCustomers(s, s.weather.forecast);
    const have = Engine.maxMakeable(s, s.activeRecipe) + (s.upgrades.restock && s.restockOn ? 150 : 0);
    if (f.demand >= 1.3 && have < est) this.toast(`🌇 Tomorrow looks ${f.icon} ${f.name}: ~${this.num(est)} customers. Stock up tonight!`, 'good', 5000);
    else if (f.demand <= 0.5) this.toast(`🌇 Tomorrow looks ${f.icon} ${f.name}: a quiet day. Don’t overbuy.`, 'day', 4000);
  },

  warnStock(fromTap) {
    const s = this.state;
    if (fromTap) { this.floatText('Out of stock!', true, 20); this.sfx('bad'); }
    if (this._stockWarned && Date.now() - this._stockWarned < 10000) return;
    this._stockWarned = Date.now();
    let msg;
    if (Engine.rescueAvailable(s)) msg = '🧺 Out of stock and money. Take Grandma’s free crate under the Sell button.';
    else if (!Engine.isUnlocked(s, 'shop')) msg = '🍋 Out of ingredients. Finish this goal to unlock the Shop.';
    else if (s.upgrades.restock && s.restockOn && s.money < Engine.recipeCost(s, s.activeRecipe) * 10) msg = '🍋 Out of stock and too little money for auto restock. Try a cheaper drink.';
    else msg = '🍋 Out of stock! Customers will walk away. <u>Open the Shop</u>';
    this.toast(msg, 'bad', 4000);
    const last = this.$('#toasts').lastChild;
    if (last && Engine.isUnlocked(s, 'shop')) last.onclick = () => { last.remove(); this.openPanel('shop'); };
  },

  onDayEnd(sum, quiet) {
    if (quiet) return;
    const w = D.WEATHER[sum.weather];
    const cls = sum.profit >= 0 ? 'pos' : 'neg';
    this.toast(
      `🌙 Day ${sum.day} ${w.icon} ${sum.cups} cups • <span class="${cls}">${this.money(sum.profit)} profit</span>` +
      (sum.wages ? ` • wages ${this.money(sum.wages, 0)}` : '') + (sum.lost ? ` • ${sum.lost} walked away` : '') +
      (sum.record ? ' • 🎉 Best day yet!' : ''),
      'day', 5000,
    );
    if (sum.quit) {
      const u = D.UPGRADES[sum.quit];
      setTimeout(() => this.toast(`${u.icon} You couldn’t pay ${this.money(sum.wagesDue, 0)} in wages, so a ${u.name.toLowerCase()} quit.`, 'bad', 6000), 300);
    }
    this.save();
  },

  onDayStart() {
    const s = this.state;
    const w = D.WEATHER[s.weather.today];
    if (w.hot || w.wet || w.demand >= 1.3 || w.demand <= 0.6) {
      this.toast(`☀️ Day ${s.day}: ${w.icon} ${w.name} (${Math.round(w.demand * 100)}% customers)`, 'day', 3000);
    }
  },

  showLevelUp(ev) {
    this.sfx('level');
    this.queuePopup(() => this.popupHtml({
      big: '🎯', title: `Level ${ev.level} done!`, cls: 'win',
      body: `${this.esc(ev.name)}${ev.reward ? ` • +${this.money(ev.reward, 0)}` : ''}`,
      extra: (ev.unlocks.length
        ? `<p class="note">New:</p><div class="unl">${ev.unlocks.map((u) => `<span class="chip">${D.UNLOCK_LABELS[u] || (D.RECIPES[u] ? D.RECIPES[u].icon + ' ' + D.RECIPES[u].name : u)}</span>`).join('')}</div>`
        : '') + (D.LEVELS[ev.level] ? `<p class="next-goal">Next: <b>${D.LEVELS[ev.level].goal}</b></p>` : '<p class="next-goal">That was the last goal. You built an empire!</p>'),
      buttons: [{ id: 'popup-ok', label: 'Nice!', cls: 'green' }],
    }));
  },

  showChoice(id) {
    const def = D.EVENTS[id];
    this.queuePopup(() => {
      const s = this.state;
      if (!s || !s.event || s.event.id !== id || s.event.choice) return null;   // already resolved (e.g. day ended)
      return this.popupHtml({
        big: def.icon, title: def.name, body: `${def.text}<br><small class="note">If you don’t choose, “${def.choices.find((c) => c.id === def.defaultChoice).label}” is picked tonight.</small>`,
        buttons: def.choices.map((c, i) => ({
          id: `choice-${c.id}`, label: c.label, cls: i === 0 ? '' : 'teal',
          onClick: () => {
            const st = this.state;
            if (!st.event || st.event.id !== id || st.event.choice) { this.toast('That offer has passed.', 'bad'); return; }
            const res = Engine.resolveChoice(st, c.id);
            if (!res.ok) { this.toast(res.reason || 'Can’t do that.', 'bad'); return false; }
            this.toast(`${def.icon} ${res.result}`);
            this.updateHud();
          },
        })),
      });
    });
  },

  resumePendingChoice() {
    const ev = this.state && this.state.event;
    if (ev && !ev.choice && D.EVENTS[ev.id].choices) this.showChoice(ev.id);
  },

  showOffline(seconds) {
    const res = Engine.simulateOffline(this.state, seconds);
    this.lastTickAt = Date.now();
    this.renderHub();
    const hours = Math.floor(seconds / 3600), mins = Math.floor((seconds % 3600) / 60);
    const away = hours ? `${hours}h ${mins}m` : `${mins}m`;
    if (res.skipped) {
      this.queuePopup(() => this.popupHtml({
        big: '👋', title: 'Welcome back', body: `You were away ${away}. Your stand was closed. Hire staff (Upgrades) and it keeps selling while you’re gone.`,
        buttons: [{ id: 'popup-ok', label: 'Back to work', cls: 'green' }],
      }));
      return res;
    }
    const capped = res.closed ? ' (the stand closed early)' : seconds > D.CONFIG.OFFLINE_CAP_TICKS ? ' (staff work up to 4h)' : '';
    this.queuePopup(() => this.popupHtml({
      big: '🍋', title: 'While you were away', body: `${away}${capped} • ${res.days} day${res.days === 1 ? '' : 's'} passed`,
      extra: `<div class="timeline">
        ${res.timeline.map((t) => `<div>${t.icon} ${this.esc(t.text)}</div>`).join('') || '<div>Quiet shift.</div>'}
        <div class="tl-total"><b>🥤 ${this.num(res.cups)} cups • <span class="${res.earned >= 0 ? 'pos' : 'neg'}">${this.money(res.earned, 0)}</span> • ⭐ ${res.repDelta >= 0 ? '+' : ''}${res.repDelta}</b></div>
      </div>
      ${res.earned < 0 ? '<p class="note">You lost money: wages cost more than sales. Check stock and auto restock.</p>' : ''}`,
      buttons: [{ id: 'popup-ok', label: 'Collect', cls: 'green' }],
    }));
    this.save();
    return res;
  },
});


/* ===== app_panels.js ===== */
/* =====================================================================
 * app_panels.js — secondary screens shown in the notebook sheet:
 * shop, recipes/pricing, upgrades, goals & challenges & achievements,
 * stats, guide, menu. Each panel is panel_<tab>() -> HTML plus
 * bind_<tab>(body) to wire it.
 * ===================================================================== */
Object.assign(App, {
  PANELS: {
    shop: { title: '🛒 Shop' },
    recipes: { title: '📖 Menu & price' },
    upgrades: { title: '🔧 Upgrades' },
    goals: { title: '🎯 Goals' },
    stats: { title: '📊 Stats' },
    guide: { title: '📘 How to play' },
    menu: { title: '☰ Menu' },
  },
  LIVE_PANELS: ['shop', 'upgrades', 'stats', 'goals'],   // rebuilt every tick (numbers move)

  openPanel(tab, sub) {
    if (!this.PANELS[tab]) return;
    this.panel = { tab, sub: sub || (this.panel && this.panel.tab === tab ? this.panel.sub : null) };
    let wrap = this.$('#panel');
    if (!wrap) {
      wrap = document.createElement('div');
      wrap.className = 'overlay';
      wrap.id = 'panel';
      // close on backdrop only if the press both started and ended there (drags out of a slider don't close)
      wrap.addEventListener('pointerdown', (e) => { this._downOnBackdrop = e.target === wrap; this._dragging = true; });
      wrap.addEventListener('click', (e) => { if (e.target === wrap && this._downOnBackdrop) this.closePanel(); });
      this._pointerUp = () => { this._dragging = false; };
      window.addEventListener('pointerup', this._pointerUp);
      window.addEventListener('pointercancel', this._pointerUp);
      this.$('#overlay-root').prepend(wrap);
      this._escHandler = (e) => { if (e.key === 'Escape' && !this.$('#popup')) this.closePanel(); };
      document.addEventListener('keydown', this._escHandler);
      this._returnFocus = document.activeElement;
    }
    wrap._lastHtml = null;
    // Opening the thing a coach tip points at counts as reading the tip.
    const tipTarget = '#tab-' + (tab === 'recipes' ? 'menu-recipes' : tab);
    if (this._coachTip && (this._coachTip.target === tipTarget || (tab === 'menu' && this._coachTip.target === '#btn-menu'))) this.dismissCoach();
    this.refreshPanel(false);
    const x = this.$('#panel-close');
    if (x) x.focus({ preventScroll: true });
  },

  closePanel() {
    const wrap = this.$('#panel');
    if (wrap) wrap.remove();
    if (this._escHandler) document.removeEventListener('keydown', this._escHandler);
    if (this._pointerUp) { window.removeEventListener('pointerup', this._pointerUp); window.removeEventListener('pointercancel', this._pointerUp); }
    this._dragging = false;
    this.panel = null;
    this.updateHud();
    if (this._returnFocus && document.contains(this._returnFocus)) this._returnFocus.focus({ preventScroll: true });
  },

  // A stable selector for the focused control, so a rebuild can restore focus.
  focusKey(el) {
    if (!el || el === document.body) return null;
    if (el.id) return '#' + el.id;
    for (const a of ['data-buy', 'data-up', 'data-fire', 'data-recipe', 'data-sub', 'data-mode', 'data-cups']) {
      if (el.hasAttribute && el.hasAttribute(a)) {
        const extra = a === 'data-buy' ? `[data-qty="${el.dataset.qty}"]` : '';
        return `[${a}="${el.getAttribute(a)}"]${extra}`;
      }
    }
    return null;
  },

  refreshPanel(fromTick) {
    if (!this.panel) return;
    const wrap = this.$('#panel');
    if (!wrap) return;
    if (fromTick && (!this.LIVE_PANELS.includes(this.panel.tab) || this._dragging)) return;
    const tab = this.panel.tab;
    const full = `<div class="box sheet" role="dialog" aria-modal="true" aria-label="${this.PANELS[tab].title}">
      <div class="sheet-head"><h2>${this.PANELS[tab].title}</h2><span class="pill"><span class="ico">🪙</span>${this.money(this.state.money)}</span>
      <button class="close-x" id="panel-close" aria-label="Close">✕</button></div>
      <div class="sheet-body" data-panel="${tab}">${this['panel_' + tab]()}</div></div>`;
    if (wrap._lastHtml === full) return;
    const oldBody = this.$('.sheet-body', wrap);
    const scroll = oldBody ? oldBody.scrollTop : 0;
    const focus = wrap.contains(document.activeElement) ? this.focusKey(document.activeElement) : null;
    wrap._lastHtml = full;
    wrap.innerHTML = full;
    this.$('#panel-close').onclick = () => this.closePanel();
    const body = this.$('.sheet-body', wrap);
    body.scrollTop = scroll;
    const bind = this['bind_' + tab];
    if (bind) bind.call(this, body);
    if (focus) {
      const el = wrap.querySelector(focus);
      if (el && !el.disabled) el.focus({ preventScroll: true });
      else this.$('#panel-close').focus({ preventScroll: true });
    }
  },

  afterAction(msg) {
    if (msg) this.toast(msg, 'good', 1600);
    const evs = Engine.checkProgress(this.state);
    this.handleEvents(evs, true);
    this.refreshPanel(false);
    this.updateHud();
  },

  lockLabel(key) {
    const n = D.unlockLevel(key);
    return n ? `🔒 After level ${n}` : '🔒 Locked';
  },

  // ---------- SHOP ----------
  panel_shop() {
    const s = this.state;
    const bulk = Engine.isUnlocked(s, 'bulk');
    const cap = Engine.storageCap(s);
    const qtys = (bulk ? D.BUY_QTYS : [10, 50]).filter((q) => q <= cap);
    const R = D.RECIPES[s.activeRecipe];
    const make = Engine.maxMakeable(s, s.activeRecipe);
    const perCup = Engine.recipeCost(s, s.activeRecipe);
    const rows = D.INGREDIENT_IDS.filter((id) => Engine.ingredientVisible(s, id))
      .sort((a, b) => (R.uses[b] ? 1 : 0) - (R.uses[a] ? 1 : 0))
      .map((id) => {
        const ing = D.INGREDIENTS[id];
        const price = Engine.ingredientPrice(s, id);
        const trend = price / ing.base;
        const arrow = trend > 1.08 ? '<span class="neg">▲ pricey</span>' : trend < 0.92 ? '<span class="pos">▼ cheap</span>' : 'normal price';
        const btns = qtys.map((q) => {
          const quote = Engine.buyQuote(s, id, q);
          const dis = quote.qty < 1 || quote.total > s.money;
          const label = quote.qty < q ? `+${quote.qty}` : `+${q}`;
          return `<button class="btn small ${quote.discount ? 'teal' : ''}" data-buy="${id}" data-qty="${q}" ${dis ? 'disabled' : ''} title="${quote.qty} for ${this.money(quote.total)}">${label} <small>${this.money(quote.total, quote.total >= 100 ? 0 : 2)}</small></button>`;
        }).join('');
        const full = s.inventory[id] >= cap;
        return `<div class="row wide ${R.uses[id] ? 'active' : ''}" data-ing="${id}">
          <div class="ic">${ing.icon}</div>
          <div><div class="t">${ing.name} <small>${this.money(price, 3)} each • ${arrow}</small></div>
          <div class="s">Stock ${this.num(s.inventory[id])}/${this.num(cap)}${full ? ' • <b>full</b>' : ''}${R.uses[id] ? ` • ${R.uses[id]} per cup` : ''}</div></div>
          <div class="acts">${btns}</div></div>`;
      }).join('');
    const opt = (cups) => {
      const cost = Engine.stockUpCost(s, s.activeRecipe, cups);
      return `<button class="btn small green" id="stockup-${cups}" data-cups="${cups}" ${cost <= 0 ? 'disabled' : ''}>Stock ${cups} cups • ${this.money(cost)}</button>`;
    };
    return `
      <div class="slider-box">
        <div class="slider-top"><span>${R.icon} ${R.name}</span><span>${this.money(perCup)} per cup today</span></div>
        <p class="note">You can make <b>${this.num(make)}</b> cups right now. Stock-up buys only what’s missing${bulk ? ' and gets bulk discounts' : ''}. Short on money? It buys as many cups as you can afford.</p>
        <div class="seg">${opt(25)}${opt(100)}${cap >= 400 ? opt(Math.min(500, Math.floor(cap / 2))) : ''}</div>
      </div>
      <p class="note">Highlighted rows are used by the drink you’re selling. Prices change every morning.${bulk ? ' Teal buttons are discounted.' : ` Bulk buying unlocks after level ${D.unlockLevel('bulk')}.`}</p>
      <div class="rows">${rows}</div>`;
  },
  bind_shop(body) {
    for (const b of this.$$('[data-buy]', body)) {
      b.onclick = () => {
        const res = Engine.buy(this.state, b.dataset.buy, Number(b.dataset.qty));
        if (!res.ok) { this.toast(res.reason, 'bad'); this.sfx('bad'); } else { this.sfx('coin'); this.afterAction(`Bought ${res.qty} ${D.INGREDIENTS[b.dataset.buy].icon}${res.discount ? ` (${res.discount * 100}% off)` : ''}`); }
      };
    }
    for (const b of this.$$('[data-cups]', body)) b.onclick = () => this.stockUp(Number(b.dataset.cups));
  },
  stockUp(cups) {
    const res = Engine.stockUp(this.state, cups);
    if (!res.ok) { this.toast(res.reason, 'bad'); this.sfx('bad'); return; }
    this.sfx('coin');
    this.afterAction(res.partial ? `Stocked ${res.cups} cups (all you could afford or store) for ${this.money(res.cost)}` : `Stocked up for ${res.cups} cups (${this.money(res.cost)})`);
  },

  // ---------- RECIPES & PRICE ----------
  priceVerdict(ratio) {
    return ratio < 0.8 ? 'Bargain: lots of customers, thin profit'
      : ratio <= 1.25 ? 'Fair price: customers are happy'
        : ratio <= 1.6 ? 'Pricey: fewer customers, reputation slowly drops' : 'Way too pricey: most people walk past and reputation drops';
  },
  panel_recipes() {
    const s = this.state;
    const rid = s.activeRecipe;
    const R = D.RECIPES[rid];
    const price = s.recipePrice[rid];
    const cost = Engine.recipeCost(s, rid);
    const ratio = price / R.base;
    const canPrice = Engine.isUnlocked(s, 'price');
    const auto = s.upgrades.autoprice && s.autoPrice.on;
    const forced = Engine.activeEffect(s).forcePriceRatio;
    const slider = canPrice ? `
      <div class="slider-box">
        <div class="slider-top"><span>${R.icon} ${R.name}</span><span class="price" id="price-val">${this.money(price)}</span></div>
        <input type="range" id="price-slider" min="${(R.base * 0.4).toFixed(2)}" max="${(R.base * 3).toFixed(2)}" step="0.05" value="${price}" ${auto ? 'disabled' : ''} aria-label="Price per cup">
        <div class="kv">
          <span>Ingredients per cup (today)</span><b>${this.money(cost)}</b>
          <span>Profit per cup</span><b class="${price - cost >= 0 ? 'pos' : 'neg'}" id="price-profit">${this.money(price - cost)}</b>
          <span>Customer interest</span><b id="price-factor">${Math.round(Engine.priceFactor(ratio) * 100)}%</b>
        </div>
        <p class="note" id="price-verdict">${this.priceVerdict(ratio)}. Suggested: ${this.money(R.base)}.</p>
        ${forced ? `<p class="note neg">🏪 You matched the competitor today, so you’re charging ${this.money(Engine.sellPrice(s))} until tonight.</p>` : ''}
        ${auto ? '<p class="note">Auto pricing is on. It picks a new price each morning and when you switch drinks.</p>' : ''}
        <div class="seg">
          <button class="btn small teal" id="price-reset" ${auto ? 'disabled' : ''}>Use suggested</button>
          ${s.upgrades.autoprice ? `<button class="btn small ${auto ? 'green' : ''}" id="auto-toggle" aria-pressed="${!!auto}">Auto pricing ${auto ? 'on' : 'off'}</button>` : ''}
        </div>
        ${s.upgrades.autoprice ? `<div class="seg" role="group" aria-label="Auto pricing strategy">${Object.keys(D.AUTO_PRICE_MODES).map((m) => `<button data-mode="${m}" class="${s.autoPrice.mode === m ? 'on' : ''}" aria-pressed="${s.autoPrice.mode === m}">${D.AUTO_PRICE_MODES[m].label}</button>`).join('')}</div>` : ''}
      </div>` : `<p class="note">${this.lockLabel('price')}: price control.</p>`;
    const rows = D.RECIPE_IDS.map((id) => {
      const r = D.RECIPES[id];
      const have = s.recipes.includes(id);
      const ing = Object.keys(r.uses).map((k) => `${r.uses[k]}${D.INGREDIENTS[k].icon}`).join(' ');
      const trend = s.trending === id && s.recipes.length > 1 ? ' 📈 trending' : '';
      const c = Engine.recipeCost(s, id);
      const can = have ? Engine.maxMakeable(s, id) : 0;
      return `<div class="row ${id === rid ? 'active' : ''} ${have ? '' : 'lockedrow'}">
        <div class="ic">${have ? r.icon : '🔒'}</div>
        <div><div class="t">${r.name}${trend}</div>
        <div class="s">${ing} • costs ${this.money(c)} • sells ~${this.money(r.base)} • loved by ${this.tagFans(r.tags)}${have ? ` • ${this.num(can)} in stock` : ''}</div></div>
        <div class="acts">${have ? (id === rid ? '<b>Selling</b>' : `<button class="btn small" data-recipe="${id}">Sell this</button>`) : `<span class="s">After level ${D.unlockLevel(id)}</span>`}</div>
      </div>`;
    }).join('');
    return `${slider}<p class="note">You sell one drink at a time. Cold drinks get +25% customers on hot days.</p><div class="rows">${rows}</div>`;
  },
  tagFans(tags) {
    const fans = D.CUSTOMERS.filter((c) => c.likes.some((t) => tags.includes(t))).map((c) => c.icon);
    return fans.join('');
  },
  bind_recipes(body) {
    const s = this.state;
    const sl = this.$('#price-slider', body);
    if (sl) {
      sl.oninput = () => {
        const rid = s.activeRecipe, R = D.RECIPES[rid];
        const p = Engine.setPrice(s, rid, Number(sl.value));
        const cost = Engine.recipeCost(s, rid);
        this.$('#price-val').textContent = this.money(p);
        const pr = this.$('#price-profit');
        pr.textContent = this.money(p - cost);
        pr.className = p - cost >= 0 ? 'pos' : 'neg';
        this.$('#price-factor').textContent = Math.round(Engine.priceFactor(p / R.base) * 100) + '%';
        this.$('#price-verdict').textContent = `${this.priceVerdict(p / R.base)}. Suggested: ${this.money(R.base)}.`;
        this.updateHud();
      };
      sl.onchange = () => { this.$('#panel')._lastHtml = null; this.afterAction(); };
    }
    const reset = this.$('#price-reset', body);
    if (reset) reset.onclick = () => { Engine.setPrice(s, s.activeRecipe, D.RECIPES[s.activeRecipe].base); this.afterAction('Price set to the suggestion'); };
    const at = this.$('#auto-toggle', body);
    if (at) at.onclick = () => { s.autoPrice.on = !s.autoPrice.on; Engine.applyAutoPrice(s); this.afterAction(); };
    for (const b of this.$$('[data-mode]', body)) b.onclick = () => { s.autoPrice.mode = b.dataset.mode; s.autoPrice.on = true; Engine.applyAutoPrice(s); this.afterAction(`Auto pricing: ${D.AUTO_PRICE_MODES[b.dataset.mode].label}`); };
    for (const b of this.$$('[data-recipe]', body)) {
      b.onclick = () => {
        Engine.setRecipe(s, b.dataset.recipe);
        const make = Engine.maxMakeable(s, s.activeRecipe);
        this.afterAction(`Now selling ${D.RECIPES[s.activeRecipe].name}`);
        if (make === 0) this.toast(`You have no ingredients for this yet. <u>Open the Shop</u>`, 'bad', 3500);
        const last = this.$('#toasts').lastChild;
        if (make === 0 && last && Engine.isUnlocked(s, 'shop')) last.onclick = () => this.openPanel('shop');
      };
    }
  },

  // ---------- UPGRADES ----------
  upgradeNow(id) {
    const s = this.state;
    switch (id) {
      case 'table': case 'lane': return `Line holds ${Engine.queueCap(s)}`;
      case 'sign': return `+${12 * s.upgrades.sign}% customers`;
      case 'umbrella': return `Rain penalty -${25 * s.upgrades.umbrella}%`;
      case 'storage': return `Holds ${this.num(Engine.storageCap(s))} each`;
      case 'juicer': return `${Engine.tapPower(s)} per tap`;
      case 'cooler': return `+${20 * s.upgrades.cooler}% on hot days`;
      case 'dispenser': return `Staff +${25 * s.upgrades.dispenser}% speed`;
      case 'forecast': return `${Math.round(D.FORECAST_ACCURACY[s.upgrades.forecast] * 100)}% accurate (from tomorrow’s roll)`;
      default: return '';
    }
  },
  panel_upgrades() {
    const s = this.state;
    const groups = [['stand', '🪑 Stand'], ['equip', '🍹 Equipment'], ['staff', '👷 Staff'], ['auto', '🤖 Automation']];
    const visible = groups.filter(([g]) => D.UPGRADE_IDS.some((id) => D.UPGRADES[id].tab === g && Engine.upgradeAvailable(s, id)));
    let sub = this.panel.sub;
    if (!visible.find(([g]) => g === sub)) sub = this.panel.sub = (visible[0] || ['stand'])[0];
    const tabs = `<div class="tabs" role="tablist">${visible.map(([g, label]) => `<button role="tab" aria-selected="${g === sub}" data-sub="${g}" class="${g === sub ? 'on' : ''}">${label}</button>`).join('')}</div>`;
    const rows = D.UPGRADE_IDS.filter((id) => D.UPGRADES[id].tab === sub).map((id) => {
      const u = D.UPGRADES[id];
      const lvl = s.upgrades[id] || 0;
      const avail = Engine.upgradeAvailable(s, id);
      const maxed = lvl >= u.max;
      const cost = D.upgradeCost(id, lvl);
      const now = avail && lvl ? this.upgradeNow(id) : '';
      let act = !avail ? `<span class="s">After level ${D.unlockLevel(u.unlock)}</span>`
        : maxed ? '<b>Maxed</b>'
          : `<button class="btn small ${u.tab === 'staff' ? 'teal' : ''}" data-up="${id}" ${s.money < cost ? 'disabled' : ''}>${u.tab === 'staff' ? 'Hire' : lvl ? 'Upgrade' : 'Buy'} ${this.money(cost, 0)}</button>`;
      if (avail && u.tab === 'staff' && lvl > 0) act += `<button class="btn small" data-fire="${id}">Let go</button>`;
      return `<div class="row ${avail ? '' : 'lockedrow'}">
        <div class="ic">${avail ? u.icon : '🔒'}</div>
        <div><div class="t">${u.name} <small>${u.max > 1 ? `${u.tab === 'staff' ? 'Hired' : 'Lv'} ${lvl}/${u.max}` : lvl ? 'Owned' : ''}</small></div>
        <div class="s">${u.desc}${now ? ` • <b>Now:</b> ${now}` : ''}</div></div>
        <div class="acts">${act}</div></div>`;
    }).join('');
    let foot = '';
    if (sub === 'staff') {
      const make = Engine.maxMakeable(s, s.activeRecipe);
      foot = `<p class="note">Wages tonight: <b>${this.money(Engine.dailyWages(s), 0)}</b>. Staff serve ${Engine.staffServeRate(s).toFixed(1)} cups/sec and keep selling while you’re away. If you can’t pay wages in full, your best-paid worker quits. They stop when you run out of stock (${this.num(make)} cups left). Letting someone go gives no refund.</p>`;
    }
    if (sub === 'auto' && s.upgrades.restock) foot = `<div class="seg"><button class="btn small ${s.restockOn ? 'green' : ''}" id="restock-toggle" aria-pressed="${s.restockOn}">Auto restock ${s.restockOn ? 'on' : 'off'}</button></div><p class="note">When fewer than 30 cups are left, auto restock buys enough for about 150 cups of your current drink.</p>`;
    return tabs + `<div class="rows">${rows}</div>` + foot;
  },
  bind_upgrades(body) {
    for (const b of this.$$('[data-sub]', body)) b.onclick = () => { this.panel.sub = b.dataset.sub; this.refreshPanel(false); };
    for (const b of this.$$('[data-up]', body)) {
      b.onclick = () => {
        const id = b.dataset.up;
        const res = Engine.buyUpgrade(this.state, id);
        if (!res.ok) { this.sfx('bad'); return this.toast(res.reason, 'bad'); }
        this.sfx('coin');
        if (res.events) this.handleEvents(res.events, true);
        const u = D.UPGRADES[id];
        this.afterAction(`${u.icon} ${u.name} ${u.tab === 'staff' ? 'hired' : u.max > 1 ? 'Lv ' + res.level : 'bought'}`);
      };
    }
    for (const b of this.$$('[data-fire]', body)) {
      b.onclick = () => {
        const res = Engine.fireStaff(this.state, b.dataset.fire);
        if (!res.ok) return this.toast(res.reason, 'bad');
        this.afterAction(`${D.UPGRADES[b.dataset.fire].name} let go. Wages now ${this.money(Engine.dailyWages(this.state), 0)}/day`);
      };
    }
    const rt = this.$('#restock-toggle', body);
    if (rt) rt.onclick = () => { this.state.restockOn = !this.state.restockOn; this.afterAction(); };
  },

  // ---------- GOALS ----------
  panel_goals() {
    const s = this.state;
    const levels = D.LEVELS.map((l, i) => {
      const done = i < s.level, cur = i === s.level;
      if (i > s.level + 2) return '';
      const p = cur ? Engine.missionProgress(s) : null;
      const unl = l.unlocks.length ? ' • unlocks ' + l.unlocks.map((u) => D.UNLOCK_LABELS[u] || (D.RECIPES[u] ? D.RECIPES[u].icon + ' ' + D.RECIPES[u].name : u)).join(', ') : '';
      return `<div class="row ${cur ? 'active' : ''} ${!done && !cur ? 'lockedrow' : ''}">
        <div class="ic">${done ? '✅' : cur ? '🎯' : '🔒'}</div>
        <div><div class="t">Level ${i + 1}: ${l.name}</div><div class="s">${l.goal} • reward ${this.money(l.reward || 0, 0)}${unl}</div>
        ${cur && l.hint ? `<div class="s">💡 ${l.hint}</div>` : ''}</div>
        <div class="acts">${cur ? `<b>${Math.round(p.pct * 100)}%</b>` : ''}</div></div>`;
    }).join('');
    const remaining = D.LEVELS.length - s.level - 3;
    const ch = Engine.isUnlocked(s, 'challenges') ? `<h3>Today’s challenges</h3><div class="rows">${s.challenges.map((c) => {
      const def = D.CHALLENGES.find((x) => x.id === c.id);
      return `<div class="row ${c.done ? 'active' : ''}"><div class="ic">${c.done ? '✅' : def.icon}</div><div><div class="t">${Engine.challengeText(c, (n) => this.money(n, 0))}</div><div class="s">Reward ${this.money(c.reward, 0)}</div></div><div class="acts">${c.done ? '<b>Done</b>' : ''}</div></div>`;
    }).join('')}</div>` : '';
    const ach = D.ACHIEVEMENTS.map((a) => `<div class="ach ${s.achievements[a.id] ? '' : 'off'}"><b>${a.icon} ${a.name}</b>${a.desc}${s.achievements[a.id] ? `<br><small>Day ${s.achievements[a.id]}</small>` : ''}</div>`).join('');
    const got = Object.keys(s.achievements).length;
    return `<div class="rows">${levels}</div>${remaining > 0 ? `<p class="note">+${remaining} more levels after these.</p>` : ''}
      ${ch}
      <h3>Achievements ${got}/${D.ACHIEVEMENTS.length}</h3><div class="grid-ach">${ach}</div>`;
  },

  // ---------- STATS ----------
  panel_stats() {
    const s = this.state, L = s.life;
    const dem = Engine.demandBreakdown(s);
    const best = Object.entries(L.cupsBy).sort((a, b) => b[1] - a[1])[0];
    const stat = (label, v) => `<div class="stat"><span>${label}</span><b>${v}</b></div>`;
    const lastDay = s.lastDay;
    const pct = (x) => `${Math.round(x * 100)}%`;
    return `
      <h3>Why customers come</h3>
      <p class="note">Every factor multiplies together. 100% is neutral.</p>
      <div class="statgrid">
        ${stat('Customers / sec', dem.total.toFixed(2))}
        ${stat('Weather', pct(dem.weather))}
        ${stat('Price', pct(dem.price))}
        ${stat('Reputation', pct(dem.rep))}
        ${stat('Upgrades', pct(dem.upgrades))}
        ${stat('Trend & taste', pct(dem.trend * dem.tag))}
        ${dem.event !== 1 ? stat('Event', pct(dem.event)) : ''}
        ${dem.prestige !== 1 ? stat('Golden lemons', pct(dem.prestige)) : ''}
      </div>
      ${lastDay ? `<h3>Yesterday (day ${lastDay.day})</h3><div class="statgrid">
        ${stat('Cups', this.num(lastDay.cups))}${stat('Revenue', this.money(lastDay.revenue))}
        ${stat('Costs (incl. wages)', this.money(lastDay.cost))}${stat('Profit', this.money(lastDay.profit))}
        ${stat('Margin', lastDay.margin + '%')}${stat('Walked away', lastDay.lost)}</div>` : ''}
      <h3>All time</h3>
      <div class="statgrid">
        ${stat('Revenue', this.money(L.revenue, 0))}${stat('Profit', this.money(L.profit, 0))}
        ${stat('Cups sold', this.num(L.cups))}${stat('Days open', L.days)}
        ${stat('Best day (cups)', this.num(L.bestDayCups))}${stat('Best day (profit)', this.money(L.bestDayProfit, 0))}
        ${stat('Best margin', L.bestMargin + '%')}${stat('Top drink', best ? D.RECIPES[best[0]].icon + ' ' + this.num(best[1]) : '—')}
        ${stat('Earned by staff', this.money(L.idleProfit, 0))}${stat('Ingredients bought', this.num(L.boughtTotal))}
        ${stat('Franchises', s.prestige.franchises)}${stat('Golden lemons', s.prestige.goldenLemons)}
      </div>`;
  },

  // ---------- GUIDE ----------
  panel_guide() {
    return `<div class="guide">${D.GUIDE.map((g) => `<div class="guide-item"><span>${g.icon}</span><div><b>${g.title}</b><p>${g.text}</p></div></div>`).join('')}</div>
      <h3>Customers</h3><div class="rows">${D.CUSTOMERS.map((c) => `<div class="row"><div class="ic">${c.icon}</div><div><div class="t">${c.name}</div><div class="s">Loves ${c.likes.join(' & ')} drinks${c.hotBoost ? ' • shows up more on hot days' : ''}${c.minRep ? ` • only visits at ${c.minRep}.0+ reputation` : ''}</div></div><div class="acts"></div></div>`).join('')}</div>
      <div class="seg"><button class="btn small teal" id="guide-replay">Replay tutorial tips</button></div>`;
  },
  bind_guide(body) {
    this.$('#guide-replay', body).onclick = () => { this.state.tips = {}; this._coachTip = null; this.closePanel(); this.toast('Tutorial tips will show again.'); };
  },

  // ---------- MENU ----------
  panel_menu() {
    const s = this.state;
    const fr = Engine.isUnlocked(s, 'franchise');
    const reward = Engine.franchiseReward(s);
    return `
      <div class="rows">
        <div class="row"><div class="ic">🍋</div><div><div class="t">${this.esc(s.name)}</div><div class="s">Day ${s.day} • Level ${s.level + 1} • 🌟 ${s.prestige.goldenLemons} golden lemons • saves automatically</div></div>
          <div class="acts"><button class="btn small teal" id="menu-save">Save now</button></div></div>
        <div class="row ${fr ? '' : 'lockedrow'}"><div class="ic">🏢</div>
          <div><div class="t">Open a franchise</div><div class="s">${fr
            ? `Start a fresh stand with +${reward} golden lemon${reward > 1 ? 's' : ''} (+5% customers each, forever). Resets money, stock, staff, reputation (−1.5) and stand upgrades. Keeps recipes, goals, stats and automation (auto restock and pricing). Needs $20,000 profit this run (now ${this.money(s.run.profit, 0)}).`
            : `${this.lockLabel('franchise')}.`}</div></div>
          <div class="acts">${fr ? `<button class="btn small" id="menu-franchise" ${Engine.canFranchise(s) ? '' : 'disabled'}>Franchise</button>` : ''}</div></div>
        <div class="row"><div class="ic">🌗</div><div><div class="t">Theme</div><div class="s">Now: ${this.prefs.theme ? this.prefs.theme : 'match device'}</div></div>
          <div class="acts"><button class="btn small teal" id="menu-theme">Switch theme</button></div></div>
        <div class="row"><div class="ic">${this.prefs.sound ? '🔊' : '🔇'}</div><div><div class="t">Sound</div><div class="s">Little blips for sales and rewards.</div></div>
          <div class="acts"><button class="btn small teal" id="menu-sound">${this.prefs.sound ? 'Mute' : 'Turn on'}</button></div></div>
        <div class="row"><div class="ic">📤</div><div><div class="t">Back up your stand</div><div class="s">Copy a save code to move your stand to another browser.</div></div>
          <div class="acts"><button class="btn small teal" id="menu-export">Export</button><button class="btn small teal" id="menu-import">Import</button></div></div>
        <div class="row"><div class="ic">📘</div><div><div class="t">How to play</div><div class="s">Rules, customers, and a tutorial replay.</div></div>
          <div class="acts"><button class="btn small teal" id="menu-guide">Open guide</button></div></div>
        <div class="row"><div class="ic">🚪</div><div><div class="t">Title screen</div><div class="s">Your stand is saved first.</div></div>
          <div class="acts"><button class="btn small" id="menu-title">Exit</button></div></div>
      </div>`;
  },
  bind_menu(body) {
    this.$('#menu-save', body).onclick = () => { this.save(); this.toast('💾 Saved'); };
    this.$('#menu-theme', body).onclick = () => {
      const order = [null, 'light', 'dark'];
      this.prefs.theme = order[(order.indexOf(this.prefs.theme) + 1) % order.length];
      this.savePrefs(); this.applyTheme(); this.refreshPanel(false);
    };
    this.$('#menu-sound', body).onclick = () => { this.prefs.sound = !this.prefs.sound; this.savePrefs(); this.refreshPanel(false); this.updateHud(); };
    this.$('#menu-guide', body).onclick = () => this.openPanel('guide');
    this.$('#menu-title', body).onclick = () => { this.save(); this.closePanel(); this.showBoot(); };
    this.$('#menu-export', body).onclick = () => {
      const code = this.exportSave();
      this.queuePopup(() => this.popupHtml({
        big: '📤', title: 'Your save code', body: 'Keep this somewhere safe. Paste it into Import on any browser.',
        extra: `<textarea class="code" id="export-code" readonly rows="4">${code}</textarea>`,
        buttons: [
          { id: 'export-copy', label: 'Copy code', cls: 'green', onClick: (w) => { const t = w.querySelector('#export-code'); t.select(); try { navigator.clipboard.writeText(code).catch(() => document.execCommand('copy')); } catch (e) { document.execCommand('copy'); } this.toast('📋 Copied'); return false; } },
          { id: 'popup-ok', label: 'Done', cls: 'teal' },
        ],
      }));
    };
    this.$('#menu-import', body).onclick = () => {
      this.queuePopup(() => this.popupHtml({
        big: '📥', title: 'Import a save', body: 'This replaces your current stand.',
        extra: `<textarea class="code" id="import-code" rows="4" placeholder="${D.CONFIG.EXPORT_PREFIX}..."></textarea>`,
        buttons: [
          { id: 'import-go', label: 'Load stand', cls: 'green', onClick: (w) => { const res = this.importSave(w.querySelector('#import-code').value); if (!res.ok) { this.toast(res.reason, 'bad'); return false; } this.toast('📥 Stand loaded'); } },
          { id: 'popup-ok', label: 'Cancel', cls: 'teal' },
        ],
      }));
    };
    const f = this.$('#menu-franchise', body);
    if (f) f.onclick = () => this.confirmPopup({
      big: '🏢', title: 'Open a franchise?', body: `Money, stock, staff and stand upgrades reset. Automation, recipes and goals stay. You get +${Engine.franchiseReward(this.state)} golden lemons.`,
      ok: 'Open franchise', onOk: () => this.doFranchise(),
    });
  },
  doFranchise() {
    const res = Engine.doFranchise(this.state);
    if (!res.ok) return this.toast(res.reason, 'bad');
    this.closePanel();
    this.renderHub();
    this.handleEvents(res.events, true);
    this.sfx('level');
    this.queuePopup(() => this.popupHtml({ big: '🏢', title: 'Franchise opened', body: `+${res.gain} golden lemons. Every stand now gets +${this.state.prestige.goldenLemons * 5}% customers.`, buttons: [{ id: 'popup-ok', label: 'Start selling', cls: 'green' }] }));
    this.save();
  },
});

</script>
</body>
</html>

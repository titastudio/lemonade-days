.pop.win h2 { font-size: 34px; text-shadow: 2px 2px 0 var(--plum); color: #fff; -webkit-text-stroke: 1px var(--plum); }

/* toasts */
#toasts { position: fixed; bottom: calc(96px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); display: grid; gap: 6px; z-index: 60; width: min(420px, calc(100% - 20px)); pointer-events: none; }
.toast { padding: 8px 12px; font-weight: 700; animation: drop .25s ease-out; pointer-events: auto; }
.toast.good { background: var(--butter); color: #4A3D59; }
.toast.bad { background: var(--pink-soft); }
.toast.day { background: #fff; color: #4A3D59; font-weight: 500; }
@keyframes drop { from { transform: translateY(-12px); opacity: 0; } }

@media (prefers-reduced-motion: reduce) {

}

  }

  // ---------- Pricing ----------
  function setPrice(state, rid, price) {
    const base = Dd.RECIPES[rid].base;
    state.recipePrice[rid] = r2(clamp(price, base * 0.4, base * 3));
    return state.recipePrice[rid];
  }
  function bestPrice(state, rid, mode) {
    const base = Dd.RECIPES[rid].base;
    const cost = recipeCost(state, rid);
    if (mode === 'volume') return r2(Math.max(base * 0.8, cost * 1.3));
    let best = base, bestScore = -Infinity;
    for (let ratio = 0.6; ratio <= 1.6001; ratio += 0.05) {
      const p = base * ratio;
      const f = priceFactor(ratio);
      const repPenalty = ratio > 1.25 ? 0.85 : 1;
      const score = (p - cost) * (mode === 'balanced' ? f * f : f) * repPenalty;
      if (score > bestScore) { bestScore = score; best = p; }
    }
    return r2(best);
  }
  function applyAutoPrice(state) {
    if (!up(state, 'autoprice') || !state.autoPrice.on) return;
    const p = bestPrice(state, state.activeRecipe, state.autoPrice.mode);
    state.recipePrice[state.activeRecipe] = p;
  }
  function setRecipe(state, rid) {
    if (!state.recipes.includes(rid)) return false;
    state.activeRecipe = rid;
    applyAutoPrice(state);
    return true;
  }

  // ---------- Upgrades ----------
  function upgradeAvailable(state, id) {
    const u = Dd.UPGRADES[id];
    return !u.unlock || isUnlocked(state, u.unlock);
  }
  function buyUpgrade(state, id) {
    const u = Dd.UPGRADES[id];
    if (!u) return { ok: false, reason: 'Unknown upgrade' };
    if (!upgradeAvailable(state, id)) return { ok: false, reason: 'Locked' };
    const lvl = up(state, id);
    if (lvl >= u.max) return { ok: false, reason: 'Maxed out' };
    const cost = Dd.upgradeCost(id, lvl);
    if (state.money < cost) return { ok: false, reason: `You need $${cost.toLocaleString()}.` };
    state.money = r2(state.money - cost);
    state.upgrades[id] = lvl + 1;
    if (id === 'autoprice') { state.autoPrice.on = true; applyAutoPrice(state); }
    return { ok: true, cost, level: lvl + 1, events: checkProgress(state) };
  }

  // Free emergency crate so a broke, empty stand is never soft-locked. Once per day.
  function rescueAvailable(state) {
    if (state.today.rescued) return false;
    if (maxMakeable(state, state.activeRecipe) > 0 || maxMakeable(state, 'classic') > 0) return false;
    return state.money < stockUpCost(state, 'classic', 10);
  }
  function claimRescue(state) {
    if (!rescueAvailable(state)) return { ok: false, reason: 'You can still buy or make lemonade.' };
    const uses = Dd.RECIPES.classic.uses;
    for (const k of Object.keys(uses)) state.inventory[k] = Math.max(state.inventory[k], uses[k] * 15);
    state.activeRecipe = 'classic';
    state.today.rescued = true;
    addNews(state, '🧺', 'Grandma dropped off an emergency crate: enough for 15 cups of classic lemonade.');
    return { ok: true, cups: 15 };
  }

  // Rough customers for a whole day in the given weather, at today's price, reputation and upgrades
  // (no event, no trend). Used by the forecast card to plan stock.
  function estimateCustomers(state, weatherId) {
    const b = demandBreakdown(state);
    const w = Dd.WEATHER[weatherId];
    let weather = w.demand;
    if (weather < 1 && w.wet) weather = 1 - (1 - weather) * (1 - 0.25 * up(state, 'umbrella'));
    let tag = b.tag / (Dd.WEATHER[state.weather.today].hot ? (Dd.RECIPES[state.activeRecipe].tags.includes('cold') ? 1.25 : 0.95) : 1);
        const eff = activeEffect(state);
    const tags = Dd.RECIPES[state.activeRecipe].tags;
    if (tags.includes('cold')) tag /= eff.coldBoost;
    if (tags.includes('fruity')) tag /= eff.fruityBoost;
    if (w.hot) tag *= tags.includes('cold') ? 1.25 : 0.95;
    const upgradesNoCooler = b.upgrades / (Dd.WEATHER[state.weather.today].hot ? 1 + 0.2 * up(state, 'cooler') : 1);
    const upg = upgradesNoCooler * (w.hot ? 1 + 0.2 * up(state, 'cooler') : 1);
    const perTick = b.base * weather * b.price * b.rep * upg * tag * b.prestige;
    return Math.round(perTick * C.DAY_TICKS);
  }

  // Let one staff member of a type go (no refund). Lowers nightly wages.
  function fireStaff(state, id) {
    if (!Dd.STAFF_IDS.includes(id) || up(state, id) < 1) return { ok: false, reason: 'No one to let go.' };
    state.upgrades[id]--;
    return { ok: true, level: state.upgrades[id] };
  }

  // ---------- Days ----------
  function rollTomorrow(state) {
    const prev = state.weather.tomorrow;
    let next;
    if (rand(state) < 0.3 && prev) next = prev;
    else next = pickWeighted(state, Dd.WEATHER_IDS, (id) => Dd.WEATHER[id].weight);
    state.weather.tomorrow = next;
    const acc = Dd.FORECAST_ACCURACY[up(state, 'forecast')];
    state.weather.accuracy = acc;
    if (rand(state) < acc) state.weather.forecast = next;
    else {
      const others = Dd.WEATHER_IDS.filter((id) => id !== next);
      state.weather.forecast = others[Math.floor(rand(state) * others.length)];
    }
  }

  function driftPrices(state) {
    for (const id of Dd.INGREDIENT_IDS) {
      const ing = Dd.INGREDIENTS[id];
      let ratio = state.prices[id] / ing.base;
      ratio += (1 - ratio) * 0.3 + (rand(state) - 0.5) * 2 * ing.vol;
      state.prices[id] = Math.round(ing.base * clamp(ratio, 0.6, 1.6) * 1000) / 1000;
    }
  }

  function resolveEventDefaults(state) {
    const ev = state.event;
    if (ev && !ev.choice && Dd.EVENTS[ev.id].choices) resolveChoice(state, Dd.EVENTS[ev.id].defaultChoice);
  }

  function resolveChoice(state, choiceId) {
    const ev = state.event;
    if (!ev || ev.choice) return { ok: false };
    const def = Dd.EVENTS[ev.id];
    const ch = def.choices && def.choices.find((c) => c.id === choiceId);
    if (!ch) return { ok: false };
    const e = ch.effect;
    if (e.cost) {
      if (state.money < e.cost) return { ok: false, reason: `You need $${e.cost}.` };
      state.money = r2(state.money - e.cost);
      state.today.cost += e.cost;
    }
    let resultText = ch.result;
    if (e.buyDeal) {
      let got = 0;
      for (const k of Object.keys(e.buyDeal)) {
        if (k === 'discount') continue;
        const qty = Math.min(e.buyDeal[k], storageCap(state) - state.inventory[k]);
        const cost = r2(qty * state.prices[k] * (1 - e.buyDeal.discount));
        if (qty > 0 && state.money >= cost) {
          state.money = r2(state.money - cost);
          state.inventory[k] += qty;
          state.life.bought[k] = (state.life.bought[k] || 0) + qty;
          state.life.boughtTotal += qty;
          got += qty;
        }
      }
      resultText = got ? `${got} delivered at ${e.buyDeal.discount * 100}% off.` : 'You had no room or money, so the deal fell through.';
    }
    if (e.rep) state.rep = clamp(state.rep + e.rep, C.REP_MIN, C.REP_MAX);
    ev.choice = choiceId;
    addNews(state, def.icon, resultText);
    return { ok: true, result: resultText };
  }

  function endDay(state) {
    resolveEventDefaults(state);
    const wagesDue = dailyWages(state);
    // Money never goes negative from wages: pay what you can; if short, the best-paid staff member quits.
    const wages = r2(Math.min(wagesDue, Math.max(0, state.money)));
    let quit = null;
    if (wagesDue > 0 && wages < wagesDue) {
      quit = [...Dd.STAFF_IDS].reverse().find((id) => up(state, id) > 0);
      state.upgrades[quit]--;
      state.rep = clamp(state.rep - 0.05, C.REP_MIN, C.REP_MAX);
      addNews(state, Dd.UPGRADES[quit].icon, `You couldn’t pay full wages, so a ${Dd.UPGRADES[quit].name.toLowerCase()} quit.`);
    }
    state.money = r2(state.money - wages);
    const t = state.today;
    t.wages = wages;
    t.cost += wages;
    state.life.cost += wages;
    state.life.profit -= wages;
    state.run.profit -= wages;
    const profit = t.revenue - t.cost;
    const margin = t.revenue > 0 ? (profit / t.revenue) * 100 : 0;
    const L = state.life;
    const record = t.cups > L.bestDayCups && L.days > 0;
    L.days++;
    L.bestDayCups = Math.max(L.bestDayCups, t.cups);
    L.bestDayProfit = Math.max(L.bestDayProfit, profit);
    if (t.cups >= 20) L.bestMargin = Math.max(L.bestMargin, Math.round(margin));
    const automated = t.cups >= 20 && t.manualCups === 0 && t.manualBuys === 0;
    if (automated) L.autoDays++;
    const summary = {
      day: state.day, weather: state.weather.today, cups: t.cups, revenue: r2(t.revenue),
      cost: r2(t.cost), wages, profit: r2(profit), margin: Math.round(margin), lost: t.lost,
      automated, record, quit, wagesDue, liked: t.liked,
      challengesDone: state.challenges.filter((c) => c.done).length, challengeCash: t.challengeCash,
    };
    state.lastDay = summary;
    return summary;
  }

  function startDay(state) {
    state.day++;
    state.tick = 0;
    state.today = emptyToday();
    state.queue = [];
    state.spawnAcc = 0;
    state.event = null;
    state.weather.today = state.weather.tomorrow;
    rollTomorrow(state);
    driftPrices(state);
    const events = [];
    // trending recipe among unlocked ones
    const tr = state.recipes[Math.floor(rand(state) * state.recipes.length)];
    if (tr !== state.trending && state.recipes.length > 1) {
      state.trending = tr;
      const line = Dd.NEWS_LINES[Math.floor(rand(state) * Dd.NEWS_LINES.length)];
      addNews(state, '📰', line.replace('{recipe}', Dd.RECIPES[tr].name));
    }
    if (isUnlocked(state, 'events') && rand(state) < 0.3) {
      const pool = Dd.EVENT_IDS.filter((eid) => !Dd.EVENTS[eid].requires || isUnlocked(state, Dd.EVENTS[eid].requires));
      const id = pool[Math.floor(rand(state) * pool.length)];
      state.event = { id, choice: null };
      const def = Dd.EVENTS[id];
      if (def.effect && def.effect.rep) state.rep = clamp(state.rep + def.effect.rep, C.REP_MIN, C.REP_MAX);
      addNews(state, def.icon, `${def.name}: ${def.text}`);
      events.push({ type: def.choices ? 'choice' : 'event', id });
    }
    const w = Dd.WEATHER[state.weather.today];
    if (w.hot) addNews(state, w.icon, `${w.name} today. Cold drinks will fly.`);
    else if (w.wet) addNews(state, w.icon, `${w.name} today. Expect fewer customers.`);
    if (isUnlocked(state, 'challenges')) rollChallenges(state);

    events.unshift({ type: 'dayStart', day: state.day, weather: state.weather.today });
    return events;
  }

  // ---------- Tick ----------
  function step(state) {
    const events = [];
    state.clock++;
    spawnCustomers(state, events);
    autoRestock(state, events);
    const rate = staffServeRate(state);
    if (rate > 0) {
      state.serveAcc += rate;
      while (state.serveAcc >= 1 && state.queue.length) {
        const r = serveOne(state, false, events);
        if (r === 'nostock') { events.push({ type: 'nostock', manual: false }); break; }
        state.serveAcc -= 1;
      }
      state.serveAcc = Math.min(state.serveAcc, Math.max(1, rate));
    }
    dropImpatient(state, events);
    state.tick++;
    if (state.tick >= C.DAY_TICKS) {
      events.push({ type: 'dayEnd', summary: endDay(state) });
      events.push(...checkProgress(state));
      events.push(...startDay(state));
    } else {
      events.push(...checkProgress(state));
    }
    return events;
  }

  // ---------- Missions & achievements ----------
  function metric(state, key) {
    const L = state.life;
    if (key.startsWith('cups:')) return L.cupsBy[key.slice(5)] || 0;
    switch (key) {
      case 'cups': return L.cups;
      case 'profit': return L.profit;
      case 'revenue': return L.revenue;
      case 'rep': return Math.round(state.rep * 100) / 100;
      case 'cupsSunny': return L.cupsSunny;
      case 'profitHot': return L.profitHot;
      case 'profitRain': return L.profitRain;
      case 'boughtLemon': return L.bought.lemon || 0;
      case 'boughtTotal': return L.boughtTotal;
      case 'bestMargin': return L.bestMargin;
      case 'idleProfit': return L.idleProfit;
      case 'premiumCups': return L.premiumCups;
      case 'recipes': return state.recipes.length;
      case 'bestDayCups': return L.bestDayCups;
      case 'staff': return staffCount(state);
      case 'autoDays': return L.autoDays;
      case 'franchises': return state.prestige.franchises;
      case 'level': return state.level + 1;
      case 'todayCups': return state.today.cups;
      case 'todayProfit': return state.today.revenue - state.today.cost;
      case 'todayLiked': return state.today.liked;
      case 'todayTrend': return state.today.trendCups;
      case 'todayCleanCups': return state.today.lost === 0 ? state.today.cups : 0;
      default: return 0;
    }
  }
  function currentMission(state) { return Dd.LEVELS[state.level] || null; }
  function missionProgress(state) {
    const m = currentMission(state);
    if (!m) return { done: true, value: 0, target: 0, pct: 1 };
    const value = metric(state, m.metric);
    return { done: value >= m.target, value, target: m.target, pct: clamp(value / m.target, 0, 1) };
  }
  function applyUnlock(state, key) {
    const was = state.unlocked[key];
    state.unlocked[key] = true;
    if (Dd.RECIPES[key] && !state.recipes.includes(key)) state.recipes.push(key);
    if (key === 'challenges' && !was && state.challenges && !state.challenges.length) rollChallenges(state);
  }
  // Rolled once each morning (and when first unlocked). Targets are fixed at roll time.
  function rollChallenges(state) {
    const pool = Dd.CHALLENGES.filter((c) => !c.needsRecipes || state.recipes.length >= c.needsRecipes);
    const picked = [];
    while (picked.length < Math.min(Dd.CHALLENGES_PER_DAY, pool.length)) {
      const c = pool[Math.floor(rand(state) * pool.length)];
      if (!picked.includes(c)) picked.push(c);
    }
    state.challenges = picked.map((c) => ({ id: c.id, target: c.target(state), reward: Dd.challengeReward(state), done: false }));
  }
  function challengeText(ch, money) {
    const def = Dd.CHALLENGES.find((x) => x.id === ch.id);
    return def.text.replace('{n}', ch.target).replace('{m}', money ? money(ch.target) : '$' + ch.target);
  }

  function checkProgress(state) {
    const events = [];
    let guard = 0;
    while (guard++ < Dd.LEVELS.length) {
      const m = currentMission(state);
      if (!m || metric(state, m.metric) < m.target) break;
      for (const u of m.unlocks) applyUnlock(state, u);
      state.level++;
      const reward = m.reward || 0;
      state.money = r2(state.money + reward);
      addNews(state, '🎯', `Level ${state.level} complete: ${m.name}.`);
      events.push({ type: 'levelUp', level: state.level, name: m.name, unlocks: m.unlocks.slice(), reward });
    }
    for (const c of state.challenges || []) {
      const def = Dd.CHALLENGES.find((x) => x.id === c.id);
      if (!c.done && def && metric(state, def.metric) >= c.target) {
        c.done = true;
        state.money = r2(state.money + c.reward);
        state.today.challengeCash += c.reward;
        events.push({ type: 'challenge', id: c.id, reward: c.reward });
      }
    }
    for (const a of Dd.ACHIEVEMENTS) {
      if (!state.achievements[a.id] && metric(state, a.metric) >= a.target) {
        state.achievements[a.id] = state.day;
        events.push({ type: 'achievement', id: a.id });
      }
    }
    return events;
  }
  function ingredientVisible(state, id) {
    const u = Dd.INGREDIENTS[id].unlock;
    return !u || isUnlocked(state, u) || state.recipes.includes(u);
  }

  // ---------- Franchise (prestige) ----------
  function franchiseReward(state) {
    return Math.max(1, Math.floor(Math.sqrt(Math.max(0, state.run.profit) / 20000)));
  }
  function canFranchise(state) { return isUnlocked(state, 'franchise') && state.run.profit >= 20000; }
  function doFranchise(state) {
    if (!canFranchise(state)) return { ok: false, reason: 'Earn $20,000 profit this run first.' };
    const gain = franchiseReward(state);
    state.prestige.goldenLemons += gain;
    state.prestige.franchises++;
    state.money = C.START_MONEY + 250 * state.prestige.goldenLemons;
    for (const id of Dd.INGREDIENT_IDS) state.inventory[id] = 0;
    Object.assign(state.inventory, C.START_INVENTORY);
    // Automation "know-how" (auto restock, auto pricing) survives; everything physical resets.
    for (const id of Dd.UPGRADE_IDS) if (Dd.UPGRADES[id].tab !== 'auto') state.upgrades[id] = 0;
    state.rep = Math.max(1, state.rep - 1.5);
    state.queue = []; state.serveAcc = 0; state.spawnAcc = 0;
    state.run.profit = 0;
    state.activeRecipe = 'classic';
    addNews(state, '🏢', `Franchise #${state.prestige.franchises} opened. +${gain} golden lemons.`);
    const events = checkProgress(state);
    return { ok: true, gain, events };
  }

  // ---------- Offline ----------
  // Runs the real tick for up to OFFLINE_CAP_TICKS. Only meaningful with staff.
  function simulateOffline(state, seconds) {
    const ticks = Math.min(Math.floor(seconds), C.OFFLINE_CAP_TICKS);
    const before = { money: state.money, cups: state.life.cups, rep: state.rep, day: state.day };
    const timeline = [];
    if (ticks < 30 || staffServeRate(state) <= 0) {
      return { ticks: 0, skipped: true, earned: 0, cups: 0, days: 0, repDelta: 0, timeline };
    }
    let closed = false, ran = 0;
    for (let i = 0; i < ticks && !closed; i++) {
      const evs = step(state);
      ran++;
      for (const e of evs) {
        if (e.type === 'dayEnd') {
          timeline.push({ icon: Dd.WEATHER[e.summary.weather].icon, text: `Day ${e.summary.day}: ${e.summary.cups} cups, $${e.summary.profit.toFixed(0)} profit${e.summary.quit ? ' (someone quit)' : ''}` });
          // A whole day with nothing sold: staff go home instead of burning wages for hours.
          if (e.summary.cups === 0) { closed = true; timeline.push({ icon: '🔒', text: 'Out of stock, so staff closed the stand.' }); }
          if (staffServeRate(state) <= 0) { closed = true; timeline.push({ icon: '🚪', text: 'No staff left, so the stand closed.' }); }
        }
        if (e.type === 'choice') resolveEventDefaults(state);
        if (e.type === 'levelUp') timeline.push({ icon: '🎯', text: `Level ${e.level} complete: ${e.name}` });
      }
    }
    return {
      ticks: ran, skipped: false, closed,
      earned: r2(state.money - before.money),
      cups: state.life.cups - before.cups,
      days: state.day - before.day,
      repDelta: Math.round((state.rep - before.rep) * 100) / 100,
      timeline: timeline.slice(-8),
    };
  }

  return {
    rand, newState, migrate, interp, r2, clamp,
    storageCap, queueCap, tapPower, repMult, staffCount, dailyWages, staffServeRate, isUnlocked,
    activeEffect, ingredientPrice, recipeCost, maxMakeable, sellPrice, priceRatio, priceFactor,
    demandBreakdown, addNews,
    tap, step, buy, buyQuote, stockUp, stockUpCost, setPrice, bestPrice, setRecipe, applyAutoPrice,
    upgradeAvailable, buyUpgrade, fireStaff, rescueAvailable, claimRescue, estimateCustomers, resolveChoice, endDay, startDay,
    metric, currentMission, missionProgress, checkProgress, ingredientVisible,
    franchiseReward, canFranchise, doFranchise, simulateOffline,
    rollChallenges, challengeText, applyUnlock,
  };
})();
if (typeof module !== 'undefined') module.exports = Engine;

const App = {

  opts: { test: false, seed: undefined, speed: 1 },
  prefs: { sound: true, theme: null },   // device-level, stored separately from the save
  timer: null,
  popups: [],           // queued popup builders, shown one at a time

  // ---------- boot ----------
  boot() {

    if (q.get('seed')) this.opts.seed = Number(q.get('seed')) >>> 0;
    if (q.get('speed')) this.opts.speed = Math.max(1, Math.min(50, Number(q.get('speed')) || 1));
    if (q.get('fresh') === '1') this.wipeSave();
    if (this.opts.test) this.prefs.sound = false;
    this.loadPrefs();

    window.addEventListener('blur', () => this.stopHold && this.stopHold());
    const unlockAudio = () => { this._audioReady = true; if (this._ctx && this._ctx.state === 'suspended') this._ctx.resume(); };
    document.addEventListener('pointerdown', unlockAudio, { capture: true });

      if (!saved) return this.newGame(name);
      this.confirmPopup({
        big: '⚠️', title: 'Replace your stand?',
        body: `${this.esc(saved.name)} (day ${saved.day}) will be deleted. This can’t be undone.`,
        ok: 'Delete and start over', onOk: () => this.newGame(name),
      });
    };
    if (saved) {
      this.$('#btn-continue').onclick = () => this.continueGame();
      this.$('#btn-continue').focus({ preventScroll: true });
    }
    this.$('#btn-guide-boot').onclick = () => this.showGuidePopup();
    const input = this.$('#name-input');
    if (input) input.addEventListener('keydown', (e) => { if (e.key === 'Enter') this.$('#btn-new').click(); });
  },

  show(which) {
    this.$('#screen-boot').classList.toggle('hidden', which !== 'boot');
    this.$('#screen-hub').classList.toggle('hidden', which !== 'hub');
  },

  resetOverlays() {
    this.popups = [];
    if (this.panel && this.closePanel) this.closePanel();   // removes its window/document listeners too
    this.panel = null;
    this._coachTip = null;
    if (this.stopHold) this.stopHold();
    const root = this.$('#overlay-root');
    if (root) root.innerHTML = '';
    const toasts = this.$('#toasts');
    if (toasts) toasts.innerHTML = '';
  },

  newGame(name) {
    this.resetOverlays();
    this.state = Engine.newState(name || 'Sunny Side Lemons', this.opts.seed);
    this.save();
    this.enterHub();
    this.queuePopup(() => this.popupHtml({
      big: '🍋', title: `Welcome to ${this.esc(this.state.name)}!`,
      body: 'Customers line up at your stand. Tap <b>Sell</b> to serve them before they lose patience. Finish goals to unlock new things.',
      buttons: [{ id: 'popup-ok', label: 'Let’s sell', cls: 'green' }],
    }));
  },

  continueGame() {
    const saved = this.readSave();
    if (!saved) return this.showBoot();
    this.resetOverlays();
    this.state = Engine.migrate(saved);
    const away = (Date.now() - (this.state.lastSeen || Date.now())) / 1000;
    this.enterHub();
    if (away > 60) this.showOffline(away);
    this.resumePendingChoice();
  },

  enterHub() {
    this.show('hub');
    this.renderHub();
    this.startLoop();
  },

  // ---------- save / load ----------
  save() {
    if (!this.state) return;
    this.state.lastSeen = Date.now();
    try { localStorage.setItem(D.CONFIG.SAVE_KEY, JSON.stringify(this.state)); } catch (e) { this._saveFailed = true; }
    this.lastSaveAt = Date.now();
  },
  readSave() {
    try {
      // current key first, then saves from before the rename to Lemonade Days
      for (const key of [D.CONFIG.SAVE_KEY, ...D.CONFIG.LEGACY_SAVE_KEYS]) {
        const raw = localStorage.getItem(key);
        const parsed = raw && this.parseSave(raw);
        if (parsed) return parsed;
      }
      return null;
    } catch (e) { return null; }
  },
  parseSave(raw) {
    try {
      const s = JSON.parse(raw);
      return s && typeof s === 'object' && s.version && s.life && s.inventory ? s : null;
    } catch (e) { return null; }
  },
  wipeSave() { try { for (const key of [D.CONFIG.SAVE_KEY, ...D.CONFIG.LEGACY_SAVE_KEYS]) localStorage.removeItem(key); } catch (e) { /* ignore */ } },
  exportSave() {
    this.save();
    const json = JSON.stringify(this.state);
    return D.CONFIG.EXPORT_PREFIX + btoa(unescape(encodeURIComponent(json)));
  },
  importSave(code) {
    const txt = String(code || '').trim();
    let json = txt;
    const prefix = [D.CONFIG.EXPORT_PREFIX, ...D.CONFIG.LEGACY_EXPORT_PREFIXES].find((p) => txt.startsWith(p));
    if (prefix) {
      try { json = decodeURIComponent(escape(atob(txt.slice(prefix.length).replace(/\s+/g, '')))); } catch (e) { return { ok: false, reason: `That code is damaged. Copy all of it, including ${D.CONFIG.EXPORT_PREFIX} at the start.` }; }
    }
    const parsed = this.parseSave(json);
    if (!parsed) return { ok: false, reason: 'That isn’t a Lemonade Days save code.' };
    parsed.lastSeen = Date.now();   // don't grant offline time for importing
    this.resetOverlays();
    this.state = Engine.migrate(parsed);
    this.save();
    this.enterHub();
    return { ok: true };
  },

  // ---------- preferences (sound, theme) ----------
  loadPrefs() {
    try {
      const raw = [D.CONFIG.PREFS_KEY, ...D.CONFIG.LEGACY_PREFS_KEYS].map((k) => localStorage.getItem(k)).find(Boolean);
      Object.assign(this.prefs, JSON.parse(raw || '{}'));
    } catch (e) { /* ignore */ }
    if (this.opts.test) this.prefs.sound = false;
    this.applyTheme();
  },
  savePrefs() { try { localStorage.setItem(D.CONFIG.PREFS_KEY, JSON.stringify(this.prefs)); } catch (e) { /* ignore */ } },
  applyTheme() {
    const root = document.documentElement;
    if (this.prefs.theme) root.dataset.theme = this.prefs.theme; else delete root.dataset.theme;
  },

  // Tiny synthesized sounds, no audio files.
  sfx(kind) {
    // Browsers only allow audio after a user gesture; creating a context earlier logs warnings.
    if (!this.prefs.sound || !this._audioReady) return;
    const now = Date.now();
    this._sfxAt = this._sfxAt || {};
    if (now - (this._sfxAt[kind] || 0) < 90) return;
    this._sfxAt[kind] = now;
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      this._ctx = this._ctx || new Ctx();
      const ctx = this._ctx;
      const tones = { sale: [880, 0.05], tip: [1175, 0.07], level: [660, 0.12], bad: [220, 0.1], coin: [988, 0.06] }[kind] || [600, 0.05];
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'square';
      o.frequency.value = tones[0];
      g.gain.setValueAtTime(0.04, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + tones[1]);
      o.connect(g).connect(ctx.destination);
      o.start();
      o.stop(ctx.currentTime + tones[1]);
      if (kind === 'level') { const o2 = ctx.createOscillator(); o2.type = 'square'; o2.frequency.value = 990; o2.connect(g); o2.start(ctx.currentTime + 0.08); o2.stop(ctx.currentTime + 0.2); }
    } catch (e) { /* audio blocked */ }
  },

  // ---------- keyboard ----------
  onKey(e) {
    if (e.key === 'Tab') this.trapFocus(e);
    // Escape dismisses informational popups (never event choices, which need a decision).
    if (e.key === 'Escape' && this.$('#popup')) {
      const dismiss = this.$('#popup #confirm-cancel') || this.$('#popup #popup-ok');
      if (dismiss) { e.preventDefault(); dismiss.click(); }
      return;
    }
    if (!this.state || this.$('#screen-hub').classList.contains('hidden')) return;
    const tag = (e.target && e.target.tagName) || '';
    if (/INPUT|TEXTAREA|SELECT/.test(tag)) return;
    if (this.$('#popup') || this.$('#panel')) return;
    if (e.key === ' ' || e.key === 's' || e.key === 'S') {
      if (tag === 'BUTTON' && e.key === ' ' && e.target.id !== 'btn-sell') return;   // let Space press the focused button
      e.preventDefault();
      if (!e.repeat || this._keyRepeatOk()) this.onSell();
    }
  },
  // Keep Tab inside the top-most dialog (popup over panel) so keyboard users can't wander behind it.
  trapFocus(e) {
    const dlg = this.$('#popup') || this.$('#panel');
    if (!dlg) return;
    const items = this.$$('button:not([disabled]), input:not([disabled]), textarea, [tabindex]:not([tabindex="-1"])', dlg).filter((el) => el.offsetParent !== null);
    if (!items.length) return;
    const first = items[0], last = items[items.length - 1];
    if (!dlg.contains(document.activeElement)) { e.preventDefault(); first.focus(); return; }
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  },
  _keyRepeatOk() {
    const now = Date.now();
    if (now - (this._lastKeySell || 0) < 120) return false;
    this._lastKeySell = now;
    return true;
  },

  // ---------- shared helpers ----------
  $(sel, root) { return (root || document).querySelector(sel); },
  $$(sel, root) { return Array.from((root || document).querySelectorAll(sel)); },
  esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); },
  money(n, dec) {
    const neg = n < 0; n = Math.abs(n);
    const d = dec === undefined ? 2 : dec;
    let s;
    if (n >= 1e9) s = (n / 1e9).toFixed(2) + 'B';
    else if (n >= 1e6) s = (n / 1e6).toFixed(2) + 'M';
    else if (n >= 10000) s = Math.round(n).toLocaleString('en-US');
    else s = n.toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
    return (neg ? '-$' : '$') + s;
  },
  num(n) { return n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : Math.round(n).toLocaleString('en-US'); },

  toast(text, kind, ms) {
    const root = this.$('#toasts');
    const t = document.createElement('div');
    t.className = `box toast ${kind || 'good'}`;
    t.innerHTML = text;
    t.onclick = () => t.remove();
    root.appendChild(t);
    while (root.children.length > 3) root.firstChild.remove();
    setTimeout(() => t.remove(), ms || 2600);
  },

  // Popups are queued so a level-up never stomps on an event choice.
  queuePopup(build) {
    this.popups.push(build);
    if (!this.$('#popup')) this.nextPopup();
  },
  nextPopup() {
    const root = this.$('#overlay-root');
    const old = this.$('#popup');
    if (old) old.remove();
    const build = this.popups.shift();
    if (!build) return;
    const wrap = document.createElement('div');
    wrap.className = 'overlay';
    wrap.id = 'popup';
    const res = build();
    if (!res) return this.nextPopup();   // builder decided it's stale
    wrap.innerHTML = res.html;
    root.appendChild(wrap);
    for (const b of res.buttons) {
      const el = wrap.querySelector('#' + b.id);
      if (el) el.onclick = () => {
        const keep = b.onClick ? b.onClick(wrap) === false : false;
        if (!keep) this.nextPopup();
      };
    }
    const first = wrap.querySelector('button');
    if (first) first.focus({ preventScroll: true });
  },
  popupHtml({ big, title, body, extra, buttons, cls }) {
    return {
      html: `<div class="box pop ${cls || ''}" role="dialog" aria-modal="true" aria-label="${this.esc(String(title).replace(/<[^>]+>/g, ''))}">
        <div class="big" aria-hidden="true">${big}</div>
        <h2>${title}</h2>
        ${body ? `<p>${body}</p>` : ''}
        ${extra || ''}
        <div class="choices">${buttons.map((b) => `<button class="btn ${b.cls || ''}" id="${b.id}">${b.label}</button>`).join('')}</div>
      </div>`,
      buttons,
    };
  },
  // In-game replacement for window.confirm (which sandboxed iframes can silently block).
  confirmPopup({ big, title, body, ok, cancel, onOk }) {
    this.queuePopup(() => this.popupHtml({
      big: big || '❓', title, body,
      buttons: [
        { id: 'confirm-ok', label: ok || 'Yes', cls: '', onClick: () => { setTimeout(onOk, 0); } },
        { id: 'confirm-cancel', label: cancel || 'Cancel', cls: 'teal' },
      ],
    }));
  },

  showGuidePopup() {
    this.queuePopup(() => this.popupHtml({
      big: '📘', title: 'How to play', cls: 'guide-pop',
      extra: `<div class="guide">${D.GUIDE.map((g) => `<div class="guide-item"><span>${g.icon}</span><div><b>${g.title}</b><p>${g.text}</p></div></div>`).join('')}</div>`,
      buttons: [{ id: 'popup-ok', label: 'Got it', cls: 'green' }],
    }));
  },
};

document.addEventListener('DOMContentLoaded', () => App.boot());

 * app_stand.js — the hub: the one persistent screen with the stand,
 * coach tip, mission bar, weather, challenges, today's numbers, stock,
 * news and the dock.
 * renderHub() builds the DOM once; updateHud() patches it every tick

Object.assign(App, {
  renderHub() {

    this.$('#btn-menu').onclick = () => this.openPanel('menu');
    this.$('#btn-help').onclick = () => this.openPanel('guide');
    this.$('#btn-sound').onclick = () => { this.prefs.sound = !this.prefs.sound; this.savePrefs(); this.updateHud(); if (this.prefs.sound) this.sfx('coin'); };
    this.$('#coach-ok').onclick = () => this.dismissCoach();
    this.$('#btn-rescue').onclick = () => {
      const res = Engine.claimRescue(this.state);
      if (!res.ok) return this.toast(res.reason, 'bad');

      this.updateHud();
